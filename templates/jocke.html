<!DOCTYPE html>
<html>
<head>
    <title>Chuck Norris Jokes</title>
</head>
<body>
    <h1>Jokes in category: {{ category }}</h1>
    {% if jokes %}
        <ul>
        {% for joke in jokes %}
            <li>{{ joke }}</li>
        {% endfor %}
        </ul>
    {% else %}
        <p>No jokes found for this category.</p>
    {% endif %}
    <a href="/">Back to form</a>
</body>
</html>
